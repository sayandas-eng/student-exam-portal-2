<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Student Exam Portal' }}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><a class="brand" href="/">Student Exam Portal</a><nav>{% if session.get('role') %}<span>{{ session.get('username') }}</span><form method="post" action="{{ url_for('logout') }}"><button class="linkbtn">Log out</button></form>{% endif %}</nav></header><main>{% with messages=get_flashed_messages() %}{% if messages %}<div class="flash">{% for m in messages %}<p>{{m}}</p>{% endfor %}</div>{% endif %}{% endwith %}{% block body %}{% endblock %}</main><footer>Private examination portal</footer></body></html>

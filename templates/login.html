{% extends 'base.html' %}{% block body %}<section class="panel narrow"><p class="eyebrow">{{kind.upper()}} ACCESS</p><h1>{{kind}} login</h1><form method="post"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">Log in</button></form>{% if kind=='Student' %}<p class="muted small">Accounts are created by your teacher. There is no public registration.</p>{% endif %}</section>{% endblock %}

{% extends 'base.html' %}{% block body %}<section class="panel narrow"><p class="eyebrow">{{kind.upper()}} ACCESS</p><h1>{{kind}} login</h1><form method="post">{% if kind=='Student' %}<label>Student name<input name="name" autocomplete="name" maxlength="100" required></label><label>Class<select name="class_level" required>{% for n in range(5,13) %}<option value="Class {{n}}">Class {{n}}</option>{% endfor %}</select></label><label>Exam code<input name="exam_code" autocapitalize="characters" required></label><label>Common password<input name="password" type="password" required></label>{% else %}<label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" required></label>{% endif %}<button class="btn" type="submit">Continue</button></form></section>{% endblock %}
